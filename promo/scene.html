<!doctype html>
<html><head><meta charset="utf-8"><title>Fahkle Motion</title>
<style>
@font-face{font-family:'Unb';src:url(unbounded.woff2) format('woff2');font-weight:200 900}
@font-face{font-family:'Grot';src:url(grotesk.woff2) format('woff2');font-weight:300 700}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
const W = 1920, H = 1080, FPS = 60, DUR = 15;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { willReadFrequently: true });

// ---------- palette (from the game) ----------
const C = {
  bg: '#0B0818', deep: '#17132B', cyan: '#4CC9F0', yellow: '#FFD23F', orange: '#FFA62B',
  magenta: '#F72585', purple: '#B5179E', green: '#80ED99', violet: '#7C5CBF', lav: '#B388FF',
  ivory: '#F7F4FD', red: '#FF5A5F', blue: '#2E9CC4'
};
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgba = (h, a = 1) => { const c = typeof h === 'string' ? hex(h) : h; return `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`; };
const mixc = (a, b, t) => { const A = hex(a), B = hex(b); return [A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t]; };
const shadeC = (h, k) => { const c = hex(h); return [c[0] * k, c[1] * k, c[2] * k]; };
const RAMP = [C.cyan, C.lav, C.magenta, C.orange, C.yellow];
const ramp = x => { x = clamp(x) * (RAMP.length - 1); const i = Math.min(RAMP.length - 2, Math.floor(x)); return mixc(RAMP[i], RAMP[i + 1], x - i); };

// ---------- math / easing ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const TAU = Math.PI * 2;
const E = {
  lin: x => x,
  inQuad: x => x * x,
  outQuad: x => 1 - (1 - x) * (1 - x),
  inCubic: x => x * x * x,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outQuart: x => 1 - Math.pow(1 - x, 4),
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  inOutExpo: x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  outBack: (x, s = 1.70158) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2),
  inBack: (x, s = 1.70158) => (s + 1) * x * x * x - s * x * x,
  outElastic: x => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * (TAU / 3)) + 1,
};
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const wob = (t, s) => Math.sin(t * 37.1 + s) * .5 + Math.sin(t * 61.7 + s * 2.3) * .3 + Math.sin(t * 97.3 + s * 3.7) * .2;
const damp = (t, t0, k, f) => t < t0 ? 0 : Math.exp(-(t - t0) * k) * Math.cos((t - t0) * f);

// ---------- camera impacts ----------
const IMPACTS = [
  { t: 1.0, a: 14, k: 9, z: .035 }, { t: 2.0, a: 26, k: 8, z: .05 }, { t: 3.5, a: 10, k: 10, z: .02 },
  { t: 5.5, a: 18, k: 12, z: .03 }, { t: 6.0, a: 14, k: 12, z: .025 }, { t: 6.5, a: 16, k: 12, z: .03 },
  { t: 9.0, a: 24, k: 8, z: .05 }, { t: 10.0, a: 40, k: 6, z: .06 }, { t: 10.12, a: 30, k: 7, z: .04 },
  { t: 12.5, a: 10, k: 9, z: .02 },
];
function camera(t) {
  let x = 0, y = 0, z = 0, r = 0;
  for (const im of IMPACTS) {
    if (t < im.t) continue;
    const d = Math.exp(-(t - im.t) * im.k);
    x += im.a * d * wob(t, im.t * 13); y += im.a * d * wob(t, im.t * 29 + 4); r += im.a * .0009 * d * wob(t, im.t * 7 + 9);
    z += im.z * Math.exp(-(t - im.t) * im.k * 1.3);
  }
  return { x, y, z, r };
}

// ---------- 3D die ----------
const FACES = [
  { n: [0, 0, 1], u: [1, 0, 0], w: [0, 1, 0], val: 1 },
  { n: [0, 0, -1], u: [-1, 0, 0], w: [0, 1, 0], val: 6 },
  { n: [1, 0, 0], u: [0, 0, -1], w: [0, 1, 0], val: 3 },
  { n: [-1, 0, 0], u: [0, 0, 1], w: [0, 1, 0], val: 4 },
  { n: [0, 1, 0], u: [1, 0, 0], w: [0, 0, -1], val: 5 },
  { n: [0, -1, 0], u: [1, 0, 0], w: [0, 0, 1], val: 2 },
];
const d5 = .52;
const PIPS = {
  1: [[0, 0]], 2: [[-d5, -d5], [d5, d5]], 3: [[-d5, -d5], [0, 0], [d5, d5]],
  4: [[-d5, -d5], [d5, -d5], [-d5, d5], [d5, d5]], 5: [[-d5, -d5], [d5, -d5], [0, 0], [-d5, d5], [d5, d5]],
  6: [[-d5, -d5], [d5, -d5], [-d5, 0], [d5, 0], [-d5, d5], [d5, d5]],
};
function rot(p, rx, ry, rz) {
  let [x, y, z] = p, c, s, t;
  c = Math.cos(rx); s = Math.sin(rx); t = y * c - z * s; z = y * s + z * c; y = t;
  c = Math.cos(ry); s = Math.sin(ry); t = x * c + z * s; z = -x * s + z * c; x = t;
  c = Math.cos(rz); s = Math.sin(rz); t = x * c - y * s; y = x * s + y * c; x = t;
  return [x, y, z];
}
// rounded-square outline in face uv space
const RR = (() => { const pts = [], r = .38, k = 1 - r; const cs = [[k, k, 0], [-k, k, 1], [-k, -k, 2], [k, -k, 3]];
  for (const [cx, cy, q] of cs) for (let i = 0; i <= 5; i++) { const a = q * Math.PI / 2 + i / 5 * Math.PI / 2; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } return pts; })();
const CIRC = Array.from({ length: 16 }, (_, i) => [Math.cos(i / 16 * TAU), Math.sin(i / 16 * TAU)]);
const LIGHT = (() => { const l = [-.45, -.75, .6], m = Math.hypot(...l); return l.map(v => v / m); })();
// orientation (rx, ry) that shows value v facing the camera
const SHOW = {};
for (const f of FACES) {
  let best = null;
  for (let a = 0; a < 4; a++) for (let b = 0; b < 4; b++) {
    const n = rot(f.n, a * Math.PI / 2, b * Math.PI / 2, 0);
    if (n[2] > .99 && !best) best = [a * Math.PI / 2, b * Math.PI / 2];
  }
  SHOW[f.val] = best;
}
function drawDie(o) {
  const { x, y, s, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, body = C.ivory, pip = C.deep, alpha = 1, hi = null, glow = null, glowA = .5 } = o;
  if (s <= .5 || alpha <= 0) return;
  const P = 2200;
  const proj = p => { const f = P / (P - p[2] * s); let px = x + p[0] * s * f, py = y + p[1] * s * f; px = x + (px - x) * sx; py = (y + s) + (py - (y + s)) * sy; return [px, py]; };
  ctx.save(); ctx.globalAlpha = alpha;
  if (glow) { const g = ctx.createRadialGradient(x, y, 0, x, y, s * 3.2); g.addColorStop(0, rgba(glow, glowA)); g.addColorStop(1, rgba(glow, 0)); ctx.fillStyle = g; ctx.fillRect(x - s * 3.2, y - s * 3.2, s * 6.4, s * 6.4); }
  const faces = [];
  for (const f of FACES) {
    const n = rot(f.n, rx, ry, rz);
    if (n[2] <= 0.015) continue;
    faces.push({ f, n, u: rot(f.u, rx, ry, rz), w: rot(f.w, rx, ry, rz) });
  }
  faces.sort((a, b) => a.n[2] - b.n[2]);
  for (const { f, n, u, w } of faces) {
    const lam = Math.max(0, n[0] * LIGHT[0] + n[1] * LIGHT[1] + n[2] * LIGHT[2]);
    const k = .5 + .55 * lam;
    const pt = (a, b, lift = 0) => proj([n[0] * (1 + lift) + u[0] * a + w[0] * b, n[1] * (1 + lift) + u[1] * a + w[1] * b, n[2] * (1 + lift) + u[2] * a + w[2] * b]);
    ctx.beginPath();
    RR.forEach(([a, b], i) => { const p = pt(a, b); i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); });
    ctx.closePath();
    ctx.fillStyle = rgba(shadeC(body, Math.min(1.08, k)));
    ctx.fill();
    ctx.lineWidth = Math.max(1, s * .03); ctx.strokeStyle = rgba(shadeC(body, k * .72)); ctx.stroke();
    // rim light
    const rim = Math.pow(1 - n[2], 2) * .35;
    if (rim > .01) { ctx.fillStyle = rgba('#ffffff', rim * .5); ctx.fill(); }
    const pr = .19;
    for (const [a, b] of PIPS[f.val]) {
      ctx.beginPath();
      CIRC.forEach(([ca, cb], i) => { const p = pt(a + ca * pr, b + cb * pr, .002); i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); });
      ctx.closePath();
      ctx.fillStyle = (hi && f.val === 1) ? hi : rgba(shadeC(pip, 1));
      ctx.fill();
    }
  }
  ctx.restore();
}

// ---------- text helpers ----------
function font(w, px, fam = 'Unb') { return `${w} ${px}px ${fam}`; }
function charLayout(str, f, track = 0) {
  ctx.save(); ctx.font = f; const out = []; let x = 0;
  for (const ch of str) { const w = ctx.measureText(ch).width; out.push({ ch, x, w }); x += w + track; }
  ctx.restore(); return { chars: out, width: x - track };
}

// ---------- precomputed randomness ----------
const R = rng(20260930);
const STREAKS = Array.from({ length: 44 }, (_, i) => ({ a: i / 44 * TAU + (R() - .5) * .12, len: .5 + R() * .9, c: RAMP[i % 5], w: 2 + R() * 5, d: R() * .08 }));
const SPARKS = Array.from({ length: 90 }, () => ({ a: R() * TAU, v: 300 + R() * 1300, c: RAMP[(R() * 5) | 0], r: 1.5 + R() * 3.5 }));
const DUST = Array.from({ length: 60 }, () => ({ dir: R() < .5 ? -1 : 1, v: 200 + R() * 700, up: 80 + R() * 380, r: 2 + R() * 5, c: R() < .5 ? C.magenta : C.cyan }));
const RINGCOL = [C.cyan, C.yellow, C.magenta, C.green, C.orange, C.lav];
const HOT = [1, 2, 3, 4, 5, 6];
const HOTSPIN = HOT.map(() => [(R() < .5 ? -1 : 1) * (2 + (R() * 2 | 0)) * TAU, (R() < .5 ? -1 : 1) * (1 + (R() * 2 | 0)) * TAU]);
const EMBERS = Array.from({ length: 140 }, () => ({ x: (R() - .5) * 1300, t0: 9.0 + R() * 1.0, v: 180 + R() * 420, sw: R() * TAU, r: 1.5 + R() * 3.5, c: R() < .6 ? C.orange : C.yellow }));
const SHARDS = [];
for (let d = 0; d < 6; d++) for (let i = 0; i < 26; i++) {
  const a = R() * TAU, v = 350 + R() * 1250, sz = 8 + R() * 30;
  SHARDS.push({ d, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 500 - R() * 400, sz, sp: (R() - .5) * 30, a0: R() * TAU,
    tri: [[R() - .5, -1], [1, R() - .5], [-(R() * .6 + .4), R() * .8]], c: R() < .62 ? C.ivory : (R() < .5 ? C.deep : (R() < .5 ? C.magenta : C.lav)) });
}
const BOKEH = Array.from({ length: 36 }, () => ({ x: R() * W, y: R() * H, r: 3 + R() * 9, v: 8 + R() * 25, ph: R() * TAU, c: RAMP[(R() * 5) | 0] }));

// wordmark particle targets (filled in init once fonts are ready)
let MARK = null, PARTS = [];
function initMark() {
  const size = 250, f = font(900, size);
  ctx.font = f; const tw = ctx.measureText('FAHKLE').width;
  const dieS = 50, gap = 44, total = tw + gap + dieS * 2;
  const x0 = (W - total) / 2, base = 560;
  MARK = { f, size, tw, x0, base, dieS, dieX: x0 + tw + gap + dieS, dieY: base - dieS - 4 };
  const oc = document.createElement('canvas'); oc.width = W; oc.height = H;
  const o = oc.getContext('2d'); o.font = f; o.fillStyle = '#fff'; o.textBaseline = 'alphabetic'; o.fillText('FAHKLE', x0, base);
  const img = o.getImageData(0, 0, W, H).data; const sp = 11; const r = rng(77);
  for (let y = 0; y < H; y += sp) for (let x = 0; x < W; x += sp) {
    if (img[(y * W + x) * 4 + 3] > 128) {
      const a0 = r() * TAU, r0 = 250 + r() * 900;
      PARTS.push({ tx: x, ty: y, a0, r0, w: (1.2 + r() * 1.4) * (r() < .5 ? 1 : -1) * 0 + 1.6 + r(), jit: r() * .18, u: (x - x0) / tw });
    }
  }
}

// grain tiles
const GRAIN = Array.from({ length: 6 }, (_, k) => {
  const g = document.createElement('canvas'); g.width = g.height = 256; const gx = g.getContext('2d'); const id = gx.createImageData(256, 256); const r = rng(99 + k);
  for (let i = 0; i < id.data.length; i += 4) { const v = r() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  gx.putImageData(id, 0, 0); return g;
});

// ======================================================================
// SCENE
// ======================================================================
function background(t) {
  // hot-pink / red tint during FAHKLE
  const bad = prog(t, 10.0, 10.05) * (1 - prog(t, 10.9, 11.6));
  ctx.fillStyle = rgba(mixc(C.bg, '#1c0616', bad)); ctx.fillRect(-100, -100, W + 200, H + 200);
  const blobs = [
    [C.violet, 560 + Math.sin(t * .5) * 260, 340 + Math.cos(t * .4) * 140, 900, .22],
    [bad > .5 ? C.red : C.magenta, 1450 + Math.cos(t * .45) * 240, 700 + Math.sin(t * .6) * 160, 820, .13 + bad * .2],
    [C.cyan, 960 + Math.sin(t * .33 + 2) * 500, 1000 + Math.cos(t * .3) * 80, 760, .08 * (1 - bad)],
  ];
  for (const [c, x, y, r, a] of blobs) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, rgba(c, a)); g.addColorStop(1, rgba(c, 0)); ctx.fillStyle = g; ctx.fillRect(-100, -100, W + 200, H + 200); }
}

// ---- S1: ignition (0 - 1.0) + burst ----
function s1(t) {
  const cx = W / 2, cy = H / 2;
  if (t < 1.0) {
    let r = 16 * E.outBack(prog(t, .1, .42), 3);
    r += 2.5 * Math.sin(t * 26) * prog(t, .42, .5) * (1 - prog(t, .7, .75));
    r *= 1 - .55 * E.inOutCubic(prog(t, .7, .93));
    r *= 1 + 1.4 * E.inExpo(prog(t, .93, 1.0));
    // crosshair lines
    const L = 520 * E.outExpo(prog(t, .28, .8)) * (1 - E.inExpo(prog(t, .88, 1)));
    ctx.strokeStyle = rgba(C.cyan, .55); ctx.lineWidth = 2;
    const gap = 36;
    ctx.beginPath(); ctx.moveTo(cx - gap - L, cy); ctx.lineTo(cx - gap, cy); ctx.moveTo(cx + gap, cy); ctx.lineTo(cx + gap + L, cy);
    ctx.moveTo(cx, cy - gap - L * .45); ctx.lineTo(cx, cy - gap); ctx.moveTo(cx, cy + gap); ctx.lineTo(cx, cy + gap + L * .45); ctx.stroke();
    // orbiting arc
    const ap = prog(t, .35, .95);
    if (ap > 0) { ctx.strokeStyle = rgba(C.magenta, .9); ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath(); const R0 = 70 - 40 * E.inCubic(prog(t, .75, 1)); ctx.arc(cx, cy, R0, t * 9, t * 9 + TAU * .7 * E.outCubic(ap)); ctx.stroke(); ctx.lineCap = 'butt'; }
    // dot glow
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 6); g.addColorStop(0, rgba(C.cyan, .5)); g.addColorStop(1, rgba(C.cyan, 0)); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r * 6, 0, TAU); ctx.fill();
    ctx.fillStyle = C.ivory; ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();
  }
  // burst
  const b = t - 1.0;
  if (b >= 0 && b < 1.1) {
    for (let i = 0; i < 3; i++) {
      const p = prog(b, i * .06, .7 + i * .12); if (p <= 0 || p >= 1) continue;
      ctx.strokeStyle = rgba([C.ivory, C.cyan, C.magenta][i], 1 - p); ctx.lineWidth = 26 * (1 - E.outCubic(p)) + 1;
      ctx.beginPath(); ctx.arc(cx, cy, 30 + (700 + i * 260) * E.outExpo(p), 0, TAU); ctx.stroke();
    }
    ctx.lineCap = 'round';
    for (const s of STREAKS) {
      const p = prog(b, s.d, s.d + .75); if (p <= 0 || p >= 1) continue;
      const hd = 50 + 1100 * s.len * E.outExpo(p), tl = 50 + 1100 * s.len * E.outExpo(clamp(p - .12)) ;
      ctx.strokeStyle = rgba(s.c, 1 - E.inCubic(p)); ctx.lineWidth = s.w * (1 - p * .7);
      ctx.beginPath(); ctx.moveTo(cx + Math.cos(s.a) * tl, cy + Math.sin(s.a) * tl); ctx.lineTo(cx + Math.cos(s.a) * hd, cy + Math.sin(s.a) * hd); ctx.stroke();
    }
    ctx.lineCap = 'butt';
    for (const s of SPARKS) {
      const p = prog(b, 0, 1.0); if (p >= 1) continue;
      const d = s.v * (1 - Math.exp(-b * 3.2)) / 3.2;
      ctx.fillStyle = rgba(s.c, 1 - p); ctx.beginPath(); ctx.arc(cx + Math.cos(s.a) * d, cy + Math.sin(s.a) * d + 200 * b * b, s.r * (1 - p * .5), 0, TAU); ctx.fill();
    }
    const fl = Math.exp(-b * 14);
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 900); g.addColorStop(0, rgba(C.ivory, .85 * fl)); g.addColorStop(1, rgba(C.cyan, 0)); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
}

// ---- S2: the die (1.0 - 3.5) ----
const FLOORY = 800, HORIZON = 560;
const HERO_T = [-.5, .72, 0];
function heroState(t) {
  const e = prog(t, 1.0, 2.0);
  const s = lerp(10, 118, E.outExpo(prog(t, 1.0, 1.55)));
  // arc: rise then fall onto the floor
  const landY = FLOORY - 118 - 40;
  let y;
  if (t < 1.6) y = lerp(H / 2, 330, E.outCubic(prog(t, 1.0, 1.6)));
  else y = lerp(330, landY, E.inQuad(prog(t, 1.6, 2.0)));
  const spin = 1 - E.outQuad(e);
  let rx = HERO_T[0] + 5 * Math.PI * spin, ry = HERO_T[1] + 3 * Math.PI * spin + .45 * Math.max(0, t - 2.0), rz = .25 * spin;
  rz += .16 * damp(t, 2.0, 6, 16);
  let sx = 1, sy = 1;
  if (t < 2.0) { const st = prog(t, 1.82, 2.0); sy = 1 + .16 * st; sx = 1 - .1 * st; }
  else { const d = damp(t, 2.0, 7, 21); sy = 1 - .3 * d; sx = 1 + .22 * d; }
  // anticipation before the split
  const an = E.inOutCubic(prog(t, 3.05, 3.4)) * (1 - prog(t, 3.4, 3.5));
  sy *= 1 - .22 * an; sx *= 1 + .14 * an;
  // hop up at split
  y -= 160 * E.outCubic(prog(t, 3.4, 3.5));
  return { x: W / 2, y, s, rx, ry, rz, sx, sy };
}
function floorGrid(t, a) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const vx = W / 2; const flash = 1 + 1.6 * Math.max(0, damp(t, 2.0, 5, 0));
  const g = ctx.createLinearGradient(0, HORIZON, 0, H); g.addColorStop(0, rgba(C.magenta, 0)); g.addColorStop(.35, rgba(C.magenta, .32 * flash)); g.addColorStop(1, rgba(C.cyan, .55 * flash));
  ctx.strokeStyle = g; ctx.lineWidth = 1.6;
  const ph = (t * 1.2) % 1;
  ctx.beginPath();
  for (let k = 0; k < 40; k++) { const z = 1 + k - ph; if (z < .6) continue; const yy = HORIZON + 260 / z * 1.9; if (yy > H + 10) continue; ctx.moveTo(0, yy); ctx.lineTo(W, yy); }
  for (let i = -24; i <= 24; i++) { ctx.moveTo(vx + i * 60 / 40, HORIZON + 260 / 40 * 1.9); ctx.lineTo(vx + i * 60 / .35, HORIZON + 260 / .35 * 1.9); }
  ctx.stroke();
  // horizon glow line
  const hg = ctx.createLinearGradient(0, 0, W, 0); hg.addColorStop(0, rgba(C.magenta, 0)); hg.addColorStop(.5, rgba(C.magenta, .8)); hg.addColorStop(1, rgba(C.magenta, 0));
  ctx.fillStyle = hg; ctx.fillRect(0, HORIZON + 11, W, 2);
  ctx.restore();
}
function callout(t, t0, ax, ay, bx, by, label, sub, col) {
  const p = E.outExpo(prog(t, t0, t0 + .35)); if (p <= 0) return;
  const out = 1 - E.inCubic(prog(t, 3.15, 3.4));
  ctx.save(); ctx.globalAlpha = out;

    const rr = p.r0 * (1 - .45 * E.outCubic(prog(t, 10.75, 12)));
    const sx = W / 2 + Math.cos(ang) * rr * 1.25, sy = H / 2 + Math.sin(ang) * rr * .7;
    const x = lerp(sx, p.tx, e), y = lerp(sy, p.ty, e);
    let r = lerp(1.6, 4.6, E.outBack(prog(t, d0 + .5, d0 + .8), 3));
    const wave = Math.max(0, Math.sin(clamp((t - 12.15 - p.u * .3) / .25) * Math.PI));
    r *= (1 + .6 * wave) * (1 - solid);
    if (r <= .1) continue;
    ctx.fillStyle = rgba(ramp(p.u), born * (.55 + .45 * e));
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  // solid wordmark with light sweep
  if (solid > 0) {
    const sc = lerp(1.05, 1, E.outExpo(prog(t, 12.45, 13.1)));
    ctx.save(); ctx.globalAlpha = solid; ctx.translate(W / 2, M.base - M.size * .36); ctx.scale(sc, sc); ctx.translate(-W / 2, -(M.base - M.size * .36));
    ctx.font = M.f; ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
    const g = ctx.createLinearGradient(M.x0, 0, M.x0 + M.tw, 0);
    RAMP.forEach((c, i) => g.addColorStop(i / (RAMP.length - 1), c));
    ctx.fillStyle = g; ctx.fillText('FAHKLE', M.x0, M.base);
    // sweep
    const sw = prog(t, 12.7, 13.4);
    if (sw > 0 && sw < 1) {
      const sx = lerp(M.x0 - 300, M.x0 + M.tw + 300, E.inOutCubic(sw));
      const lg = ctx.createLinearGradient(sx - 140, 0, sx + 140, 0); lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(.5, 'rgba(255,255,255,.85)'); lg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.globalCompositeOperation = 'source-atop';
      ctx.save(); ctx.fillStyle = lg; ctx.transform(1, 0, -.3, 1, 0, 0); ctx.fillText('FAHKLE', M.x0 + .3 * M.base, M.base); ctx.restore();
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();
  }
  // punctuation die: drops in and lands at 12.5, hops at 14.3
  const dp = prog(t, 12.15, 12.5);
  if (dp > 0) {
    let y = lerp(-150, M.dieY, E.inQuad(dp));
    let sx = 1, sy = 1;
    if (t >= 12.5) { const d = damp(t, 12.5, 8, 22); sy = 1 - .3 * d; sx = 1 + .2 * d; }
    const hop = Math.sin(clamp((t - 14.2) / .42) * Math.PI); y -= 90 * Math.max(0, hop);
    const spinE = E.outCubic(dp);
    const turn = TAU * E.inOutCubic(prog(t, 14.2, 14.62));
    drawDie({ x: M.dieX, y, s: M.dieS, rx: -.28 + 3 * TAU * (1 - spinE), ry: .45 + 2 * TAU * (1 - spinE) + turn, rz: 0, sx, sy, body: C.ivory, pip: C.deep, hi: C.magenta, glow: C.magenta, glowA: .35 });
  }
  // eyebrow + tagline + url
  const eb = prog(t, 12.85, 13.25);
  if (eb > 0) {
    ctx.save(); ctx.font = font(700, 22, 'Grot'); ctx.textAlign = 'center'; ctx.fillStyle = rgba(C.lav, eb);
    const tr = lerp(22, 9, E.outExpo(eb));
    const L = charLayout('A PASS & PLAY DICE GAME', font(700, 22, 'Grot'), tr);
    const x0 = W / 2 - L.width / 2; ctx.textAlign = 'left';
    L.chars.forEach(c => ctx.fillText(c.ch, x0 + c.x, M.base - M.size * .92));
    ctx.restore();
  }
  const tg = prog(t, 13.0, 13.6);
  if (tg > 0) {
    const str = 'PUSH YOUR LUCK.';
    const f = font(800, 50);
    const tr = lerp(40, 12, E.outExpo(tg));
    const L = charLayout(str, f, tr);
    const x0 = W / 2 - L.width / 2, y = M.base + 118;
    ctx.save(); ctx.font = f;
    L.chars.forEach((c, j) => { const p = E.outCubic(prog(t, 13.0 + j * .025, 13.25 + j * .025)); ctx.fillStyle = rgba(j >= str.length - 1 ? C.magenta : C.ivory, p); ctx.fillText(c.ch, x0 + c.x, y + (1 - p) * 26); });
    // side rules
    const lp = E.outExpo(prog(t, 13.15, 13.8));
    ctx.fillStyle = rgba(C.lav, .5); ctx.fillRect(x0 - 40 - 260 * lp, y - 17, 260 * lp, 2); ctx.fillRect(x0 + L.width + 40, y - 17, 260 * lp, 2);
    ctx.restore();
  }
  const up = E.outExpo(prog(t, 13.45, 14.0));
  if (up > 0) {
    ctx.save(); ctx.font = font(500, 28, 'Grot'); ctx.textAlign = 'center'; ctx.fillStyle = rgba(C.cyan, up);
    ctx.fillText('antrhds.github.io/Fahkle', W / 2, M.base + 190 + (1 - up) * 20);
    ctx.restore();
  }
}

// ---- HUD chrome (drawn crisp, after blur) ----
const SCENES = [[0, '01', 'IGNITION'], [1.0, '02', 'THE DIE'], [3.5, '03', 'SIX SIDES'], [5.5, '04', 'THE LOOP'], [8.0, '05', 'HOT DICE'], [10.0, '06', 'FAHKLE!'], [11.0, '07', 'RESOLVE']];
function hud(t, frame) {
  const a = E.outCubic(prog(t, .1, .5)) * (1 - prog(t, 12.2, 12.6));
  if (a <= 0) return;
  const onSlab = t > 5.45 && t < 7.62;
  const col = onSlab ? C.deep : C.ivory;
  ctx.save(); ctx.globalAlpha = a * .8;
  ctx.strokeStyle = col; ctx.lineWidth = 2;
  const m = 56, L = 36 * E.outExpo(prog(t, .1, .6));
  for (const [x, y, sx, sy] of [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]]) { ctx.beginPath(); ctx.moveTo(x, y + sy * L); ctx.lineTo(x, y); ctx.lineTo(x + sx * L, y); ctx.stroke(); }
  ctx.font = font(700, 17, 'Grot'); ctx.fillStyle = col; ctx.textBaseline = 'middle';
  ctx.textAlign = 'left'; ctx.fillText('FAHKLE  ·  MOTION STUDY', m + 22, m + 12);
  // scene label slot-machine
  let si = 0; for (let i = 0; i < SCENES.length; i++) if (t >= SCENES[i][0]) si = i;
  const sp = E.outExpo(prog(t, SCENES[si][0], SCENES[si][0] + .3));
  ctx.textAlign = 'right';
  ctx.save(); ctx.beginPath(); ctx.rect(W - 600, m - 6, 600 - m - 20, 40); ctx.clip();
  if (si > 0) ctx.fillText(`${SCENES[si - 1][1]} — ${SCENES[si - 1][2]}`, W - m - 22, m + 12 - sp * 30);
  ctx.fillText(`${SCENES[si][1]} — ${SCENES[si][2]}`, W - m - 22, m + 12 + (1 - sp) * 30);
  ctx.restore();
  ctx.textAlign = 'left'; ctx.fillText('PASS & PLAY  ·  1–4 PLAYERS', m + 22, H - m - 12);
  const sec = Math.floor(frame / FPS), fr = frame % FPS;
  ctx.textAlign = 'right'; ctx.fillText(`00:00:${String(sec).padStart(2, '0')}:${String(fr).padStart(2, '0')}`, W - m - 22, H - m - 12);
  // progress bar
  ctx.fillStyle = rgba(col, .25); ctx.fillRect(m + 22, H - m + 10, W - 2 * m - 44, 2);
  ctx.fillStyle = onSlab ? C.deep : C.magenta; ctx.fillRect(m + 22, H - m + 10, (W - 2 * m - 44) * (t / DUR), 2);
  ctx.restore();
}

function scene(t) {
  const cam = camera(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.lineCap = 'butt'; ctx.setLineDash([]);
  background(t);
  const pushIn = 1 + .03 * E.inOutCubic(prog(t, 12.5, 15)) + .04 * E.outCubic(prog(t, 2.0, 3.3)) * (1 - prog(t, 3.3, 3.5));
  const zs = (1 + cam.z) * pushIn;
  ctx.translate(W / 2 + cam.x, H / 2 + cam.y); ctx.rotate(cam.r); ctx.scale(zs, zs); ctx.translate(-W / 2, -H / 2);
  s1(t); s2(t); s3(t); s4(t); s5(t); s6(t); s7(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

// ---- post: glitch, vignette, grain, fade ----
function post(t, frame) {
  // glitch during FAHKLE
  const gl = (t >= 10.0 && t < 10.55) || (t >= 10.72 && t < 10.8) || (t >= 7.5 && t < 7.53);
  if (gl) {
    const r = rng(((t * 20) | 0) + 5);
    const n = 7 + (r() * 6 | 0);
    for (let i = 0; i < n; i++) {
      const y = r() * H | 0, h = 8 + r() * 90 | 0, dx = (r() - .5) * 220 * (1 - prog(t, 10.0, 10.55) * .7);
      ctx.drawImage(cv, 0, y, W, h, dx, y, W, h);
    }
    // RGB split
    const id = ctx.getImageData(0, 0, W, H), d = id.data, s = new Uint8ClampedArray(d);
    const k = (14 * (1 - prog(t, 10.0, 10.55)) + 4 | 0) * 4;
    for (let i = 0; i < d.length; i += 4) { d[i] = s[i + k] ?? s[i]; d[i + 2] = s[i - k] ?? s[i + 2]; }
    ctx.putImageData(id, 0, 0);
    // scanlines
    ctx.fillStyle = 'rgba(0,0,0,.18)'; for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 2);
  }
  hud(t, frame);
  // vignette
  const onSlab = t > 5.45 && t < 7.6;
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(0,0,0,${onSlab ? .28 : .6})`);
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  // grain
  ctx.save(); ctx.globalAlpha = .07; ctx.globalCompositeOperation = 'overlay';
  const g = GRAIN[frame % GRAIN.length], ox = (frame * 97) % 256, oy = (frame * 57) % 256;
  ctx.translate(-ox, -oy); ctx.fillStyle = ctx.createPattern(g, 'repeat'); ctx.fillRect(0, 0, W + 256, H + 256);
  ctx.restore();
  // fade out the last beat
  const fo = prog(t, 14.8, 15.0);
  if (fo > 0) { ctx.fillStyle = rgba('#000', E.inCubic(fo)); ctx.fillRect(0, 0, W, H); }
  const fi = 1 - prog(t, 0, .1);
  if (fi > 0) { ctx.fillStyle = rgba('#000', fi); ctx.fillRect(0, 0, W, H); }
}

// ---- frame entry points ----
let acc = null;
function renderFrame(frame, sub = 1, shutter = .5) {
  const t = frame / FPS;
  if (sub <= 1) { scene(t); post(t, frame); return; }
  if (!acc) acc = new Float32Array(W * H * 4);
  acc.fill(0);
  for (let k = 0; k < sub; k++) {
    const ts = t + (k / sub - .5) * shutter / FPS;
    scene(Math.max(0, ts));
    const d = ctx.getImageData(0, 0, W, H).data;
    for (let i = 0; i < d.length; i++) acc[i] += d[i];
  }
  const out = ctx.createImageData(W, H), o = out.data, inv = 1 / sub;
  for (let i = 0; i < o.length; i++) o[i] = acc[i] * inv;
  ctx.putImageData(out, 0, 0);
  post(t, frame);
}
function grab() {
  const d = ctx.getImageData(0, 0, W, H).data;
  return new Promise(res => { const fr = new FileReader(); fr.onload = () => { const s = fr.result; res(s.slice(s.indexOf(',') + 1)); }; fr.readAsDataURL(new Blob([d.buffer])); });
}
window.ready = (async () => {
  await document.fonts.load('900 100px Unb'); await document.fonts.load('700 20px Grot'); await document.fonts.load('500 20px Grot');
  await document.fonts.ready; initMark(); return PARTS.length;
})();
window.renderFrame = renderFrame; window.grab = grab;
